<!DOCTYPE html>
<html>
<head><title>示例文档 v1</title></head>
<body>
  <div id="main" class="container wide">
    <ul class="list primary" data-tags="新闻, 热点">
      <li class="item active" data-info="a, b">第一条</li>
      <li class="item" data-info="hello world">第二条
        <ul class="list nested">
          <li class="item sub">子条目一</li>
          <li class="item sub special">子条目二</li>
        </ul>
      </li>
      <li class="item">第三条</li>
    </ul>
    <ul class="list secondary">
      <li class="item">备用一</li>
      <li class="item active">备用二</li>
    </ul>
    <p class="note" title="带 空格,逗号 的标题">备注文本</p>
  </div>
</body>
</html>
